<title>Jev Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Material 3 roles, generated and contrast-audited by src/tokens.mjs.
   The build refuses to render if any text pair falls under 4.5:1. */
:root{
__TOKENS_LIGHT__
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
__TOKENS_DARK__
}}
:root[data-theme="dark"]{
__TOKENS_DARK_2__
}
:root{
  --ui:"Instrument Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --display:"Instrument Serif",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --t-d:34px; --t-d-lh:40px;
  --t-tl:17px; --t-tl-lh:24px;
  --t-t:15px; --t-t-lh:21px;
  --t-b:14.5px; --t-b-lh:22px;
  --t-s:13px; --t-s-lh:19px;
  --t-l:11.5px; --t-l-lh:16px;
  --r-xs:6px; --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:28px; --r-f:999px;
  --e1:0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.05);
  --e2:0 2px 4px rgba(0,0,0,.05), 0 6px 14px -6px rgba(0,0,0,.12);
  --e3:0 4px 8px rgba(0,0,0,.05), 0 16px 32px -12px rgba(0,0,0,.18);
  --e4:0 8px 16px rgba(0,0,0,.06), 0 28px 56px -16px rgba(0,0,0,.24);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:44px;
  --ease:cubic-bezier(.2,0,0,1);
  --top:64px; --rail:268px; --pane:clamp(380px,32vw,520px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --e1:0 1px 2px rgba(0,0,0,.5); --e2:0 2px 6px rgba(0,0,0,.55);
  --e3:0 8px 24px rgba(0,0,0,.6); --e4:0 16px 48px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--on-surface);font-family:var(--ui);
  font-size:var(--t-b);line-height:var(--t-b-lh);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}
p{margin:0}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-xs)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ov{font-family:var(--mono);font-size:var(--t-l);letter-spacing:.12em;text-transform:uppercase;color:var(--on-surface-variant)}

/* ───────── top bar ───────── */
.top{height:var(--top);display:flex;align-items:center;gap:var(--s4);padding:0 var(--s5);
  background:var(--surface);border-bottom:1px solid var(--outline-variant);position:relative;z-index:30}
.brand{display:flex;align-items:baseline;gap:var(--s2);flex:none}
.brand b{font-family:var(--display);font-size:25px;font-weight:400;letter-spacing:-.01em}
.brand i{font-family:var(--mono);font-style:normal;font-size:var(--t-l);color:var(--on-surface-variant)}
@media (max-width:980px){.brand i{display:none}}
.search{flex:1 1 300px;max-width:440px;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--on-surface-variant);pointer-events:none}
.search input{width:100%;height:42px;padding:0 var(--s4) 0 42px;border:1px solid var(--outline-variant);
  border-radius:var(--r-f);background:var(--surface-container-low);font-size:var(--t-b);transition:all .18s var(--ease)}
.search input:hover{background:var(--surface-container)}
.search input:focus{outline:none;border-color:var(--primary);background:var(--surface-container-lowest);box-shadow:var(--e2)}
.picks{display:flex;gap:var(--s2);flex:none}
@media (max-width:900px){.picks{display:none}}
.pick{height:42px;padding:0 var(--s7) 0 var(--s4);border:1px solid var(--outline-variant);border-radius:var(--r-f);
  background-color:var(--surface-container-low);font-size:var(--t-s);font-weight:500;cursor:pointer;
  appearance:none;-webkit-appearance:none;max-width:210px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.pick:hover{background-color:var(--surface-container)}
.pick.on{background-color:var(--primary-container);color:var(--on-primary-container);border-color:var(--primary-container)}
.acts{display:flex;align-items:center;gap:var(--s2);margin-left:auto;flex:none}
.ico{width:42px;height:42px;border-radius:var(--r-f);display:grid;place-items:center;color:var(--on-surface-variant);transition:all .16s var(--ease);flex:none}
.ico:hover{background:var(--surface-container-high);color:var(--on-surface)}
.railbtn{display:none}
@media (max-width:1080px){.railbtn{display:grid}}

/* ───────── shell ───────── */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:calc(100% - var(--top))}
body.pane-open .shell{grid-template-columns:var(--rail) minmax(0,1fr) var(--pane)}
@media (max-width:1080px){.shell,body.pane-open .shell{grid-template-columns:minmax(0,1fr)}}

/* ───────── left rail ───────── */
.rail{overflow-y:auto;overscroll-behavior:contain;padding:var(--s5) var(--s3) var(--s8);
  border-right:1px solid var(--outline-variant);background:var(--surface)}
@media (max-width:1080px){
  .rail{position:fixed;inset:var(--top) auto 0 0;width:290px;z-index:28;background:var(--surface-container-low);
    box-shadow:var(--e4);transform:translateX(-101%);transition:transform .28s var(--ease)}
  .rail.open{transform:none}
}
.rgrp{margin-bottom:var(--s6)}
.rgrp-h{display:flex;align-items:center;justify-content:space-between;padding:0 var(--s3) var(--s3)}
.reset{font-size:var(--t-s);color:var(--primary);font-weight:600;padding:2px var(--s2);border-radius:var(--r-xs)}
.reset:hover{background:var(--surface-container-high)}
.reset[hidden]{display:none!important}
.fam{margin-bottom:var(--s2)}
.fam-h{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s2) var(--s3);border-radius:var(--r-s);
  font-size:var(--t-s);font-weight:600;color:var(--on-surface);transition:background .14s}
.fam-h:hover{background:var(--surface-container)}
.fam-h[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container)}
.fam-dot{width:8px;height:8px;border-radius:3px;flex:none;background:var(--fc)}
.fam-n{margin-left:auto;font-family:var(--mono);font-size:var(--t-l);color:var(--on-surface-variant);font-weight:400}
.fields{padding:var(--s1) 0 var(--s2) var(--s5)}
.fld{display:grid;grid-template-columns:1fr auto;gap:3px var(--s2);width:100%;padding:var(--s2) var(--s3);
  border-radius:var(--r-s);transition:background .14s}
.fld:hover{background:var(--surface-container)}
.fld[aria-pressed="true"]{background:var(--secondary-container)}
.fld-n{font-size:var(--t-s);color:var(--on-surface-variant);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld[aria-pressed="true"] .fld-n{color:var(--on-secondary-container);font-weight:600}
.fld-c{font-family:var(--mono);font-size:var(--t-l);color:var(--on-surface-variant)}
.fld-bar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--surface-container-highest);overflow:hidden}
.fld-bar i{display:block;height:100%;border-radius:2px;background:var(--fc);font-style:normal}
.opt{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s2) var(--s3);border-radius:var(--r-s);
  font-size:var(--t-s);color:var(--on-surface-variant);transition:background .14s}
.opt:hover{background:var(--surface-container);color:var(--on-surface)}
.opt[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);font-weight:600}
.opt-n{margin-left:auto;font-family:var(--mono);font-size:var(--t-l);opacity:.8}

/* ───────── centre feed ───────── */
.feed{overflow-y:auto;overscroll-behavior:contain;padding:var(--s6) var(--s7) var(--s8)}
@media (max-width:640px){.feed{padding:var(--s4) var(--s4) var(--s8)}}
.fhead{display:flex;align-items:flex-end;gap:var(--s4);margin-bottom:var(--s6);flex-wrap:wrap}
.fhead h1{font-family:var(--display);font-size:var(--t-d);line-height:var(--t-d-lh);font-weight:400;letter-spacing:-.015em}
.fhead .sub{color:var(--on-surface-variant);font-size:var(--t-s);margin-top:3px}
.sorter{margin-left:auto;display:flex;gap:2px;background:var(--surface-container);padding:3px;border-radius:var(--r-f)}
.sorter button{padding:6px 14px;border-radius:var(--r-f);font-size:var(--t-s);font-weight:500;color:var(--on-surface-variant);transition:all .16s var(--ease)}
.sorter button[aria-pressed="true"]{background:var(--surface-container-lowest);color:var(--on-surface);box-shadow:var(--e1)}

.bento{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:var(--s5);align-items:start}
@media (min-width:1500px){.bento{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}
.card{background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:var(--r-l);
  overflow:hidden;box-shadow:var(--e1);cursor:pointer;display:flex;flex-direction:column;min-width:0;
  transition:box-shadow .24s var(--ease),transform .24s var(--ease),border-color .24s var(--ease)}
.card:hover{box-shadow:var(--e3);transform:translateY(-3px);border-color:var(--outline)}
.card:active{transform:translateY(-1px)}
.card[data-sel="1"]{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary),var(--e3)}
.card.wide{grid-column:span 2}
@media (max-width:640px){.card.wide{grid-column:span 1}}
.cover{position:relative;aspect-ratio:16/10;background:var(--surface-container-high);overflow:hidden;flex:none}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
/* A GitHub social card is 2:1 and carries TEXT -- the repo name, the
   description, the star count. Cropping it to fill a 16:10 frame cuts the name
   off both edges, which is worse than a letterbox. Screenshots still fill. */
.cover[data-og="1"]{background:var(--surface-container-high)}
.cover[data-og="1"] img{object-fit:contain}
.gen{position:absolute;inset:0;display:grid;place-items:center;
  background:linear-gradient(140deg,color-mix(in srgb,var(--fc) 30%,var(--surface-container-high)),var(--surface-container-high) 72%)}
.gen span{font-family:var(--display);font-size:46px;line-height:1;color:var(--on-surface);opacity:.5}
.srcbadge{position:absolute;top:var(--s3);left:var(--s3);display:inline-flex;align-items:center;height:23px;
  padding:0 var(--s2);border-radius:var(--r-xs);font-size:var(--t-l);font-weight:600;letter-spacing:.03em;
  background:var(--inverse-surface);color:var(--inverse-on-surface)}
.cbody{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2);flex:1;min-width:0}
.ctitle{font-size:var(--t-tl);line-height:var(--t-tl-lh);font-weight:600;letter-spacing:-.015em;
  overflow-wrap:break-word;word-break:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cdesc{font-size:var(--t-s);line-height:var(--t-s-lh);color:var(--on-surface-variant);overflow-wrap:break-word;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.wide .cdesc{-webkit-line-clamp:2}
.cfoot{display:flex;align-items:center;gap:var(--s2);margin-top:auto;padding-top:var(--s3);
  border-top:1px solid var(--outline-variant);font-size:var(--t-l);color:var(--on-surface-variant);min-width:0}
.who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.metric{margin-left:auto;flex:none;font-family:var(--mono)}
.catdot{width:7px;height:7px;border-radius:2px;background:var(--fc);flex:none}

/* ───────── right reading pane ───────── */
.pane{border-left:1px solid var(--outline-variant);background:var(--surface-container-low);
  overflow-y:auto;overscroll-behavior:contain;display:none}
body.pane-open .pane{display:block}
@media (max-width:1080px){
  body.pane-open .pane{position:fixed;inset:var(--top) 0 0 auto;width:min(520px,100%);z-index:29;box-shadow:var(--e4)}
}
.pane-top{position:sticky;top:0;background:var(--surface-container-low);padding:var(--s4) var(--s5);
  border-bottom:1px solid var(--outline-variant);display:flex;align-items:center;gap:var(--s2);z-index:2}
.pane-top .ov{margin-right:auto}
.pane-body{padding:var(--s5) var(--s5) var(--s8)}
.pane-cover{aspect-ratio:16/10;border-radius:var(--r-m);overflow:hidden;background:var(--surface-container-high);
  margin-bottom:var(--s5);position:relative;box-shadow:var(--e2)}
.pane-cover img{width:100%;height:100%;object-fit:cover;display:block}
.pane-cover[data-og="1"] img{object-fit:contain}
.pane h2{font-family:var(--display);font-size:28px;line-height:34px;font-weight:400;letter-spacing:-.01em;margin-bottom:var(--s3)}
.lede{font-size:var(--t-b);line-height:23px;color:var(--on-surface-variant);margin-bottom:var(--s5)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--s3) var(--s4);align-items:baseline;
  padding:var(--s4);background:var(--surface-container);border-radius:var(--r-m);margin-bottom:var(--s5)}
.kv dt{font-family:var(--mono);font-size:var(--t-l);letter-spacing:.1em;text-transform:uppercase;color:var(--on-surface-variant)}
.kv dd{margin:0;font-size:var(--t-s);font-weight:500;overflow-wrap:break-word;min-width:0}
.cta{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s5)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:42px;padding:0 var(--s5);
  border-radius:var(--r-f);font-size:var(--t-s);font-weight:600;transition:all .18s var(--ease)}
.btn-f{background:var(--primary);color:var(--on-primary);box-shadow:var(--e1)}
.btn-f:hover{box-shadow:var(--e2);transform:translateY(-1px)}
.btn-o{border:1px solid var(--outline);color:var(--on-surface)}
.btn-o:hover{background:var(--surface-container-high)}
.sec{margin-bottom:var(--s5)}
.sec .ov{display:block;margin-bottom:var(--s3)}
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:var(--s4);padding:var(--s3) 0;border-top:1px solid var(--outline-variant)}
.step:first-child{border-top:0;padding-top:0}
.sdot{width:26px;height:26px;border-radius:var(--r-f);background:var(--primary-container);color:var(--on-primary-container);
  display:grid;place-items:center;font-family:var(--mono);font-size:var(--t-l);font-weight:600;flex:none}
.sname{font-size:var(--t-t);font-weight:600;margin-bottom:2px}
.sdet{font-size:var(--t-s);line-height:var(--t-s-lh);color:var(--on-surface-variant)}
.risk{font-size:var(--t-s);line-height:var(--t-s-lh);color:var(--on-surface-variant);padding-left:var(--s5);
  position:relative;margin-bottom:var(--s2)}
.risk::before{content:"";position:absolute;left:0;top:6px;width:8px;height:8px;border-radius:2px;background:var(--error)}
.related{display:flex;flex-direction:column;gap:var(--s2)}
.rel{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);border-radius:var(--r-s);
  background:var(--surface-container);transition:background .14s;width:100%;min-width:0}
.rel:hover{background:var(--surface-container-high)}
.rel-t{font-size:var(--t-s);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fab{position:fixed;right:var(--s6);bottom:var(--s6);width:58px;height:58px;border-radius:var(--r-l);
  background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;
  box-shadow:var(--e3);z-index:26;transition:all .2s var(--ease)}
.fab:hover{box-shadow:var(--e4);transform:translateY(-2px)}
body.pane-open .fab{right:calc(var(--pane) + var(--s6))}
@media (max-width:1080px){body.pane-open .fab{right:var(--s6)}}
.empty{padding:var(--s8) var(--s5);text-align:center}
.empty h3{font-family:var(--display);font-size:26px;font-weight:400;margin-bottom:var(--s3)}
.empty p{color:var(--on-surface-variant);max-width:44ch;margin:0 auto var(--s5)}
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--inverse-surface) 42%,transparent);z-index:27}
.scrim[hidden]{display:none!important}
@media (min-width:1081px){.scrim{display:none!important}}
.cmdk{position:fixed;inset:0;background:color-mix(in srgb,var(--inverse-surface) 50%,transparent);z-index:60;
  display:grid;place-items:start center;padding-top:12vh;padding-inline:var(--s4)}
.cmdk[hidden]{display:none!important}
.cmd{width:min(620px,100%);background:var(--surface-container-high);border-radius:var(--r-xl);box-shadow:var(--e4);overflow:hidden}
.cmd input{width:100%;height:60px;padding:0 var(--s5);border:0;border-bottom:1px solid var(--outline-variant);background:none;font-size:16px}
.cmd input:focus{outline:none}
.cmd-l{max-height:52vh;overflow-y:auto;padding:var(--s2)}
.cmd-i{display:flex;align-items:center;gap:var(--s3);min-height:46px;padding:0 var(--s4);border-radius:var(--r-m);width:100%;font-size:var(--t-b)}
.cmd-i[data-s="1"]{background:var(--secondary-container);color:var(--on-secondary-container)}
.cmd-k{margin-left:auto;font-family:var(--mono);font-size:var(--t-l);color:var(--on-surface-variant);flex:none}
.snack{position:fixed;left:50%;bottom:var(--s6);transform:translate(-50%,180%);background:var(--inverse-surface);
  color:var(--inverse-on-surface);height:46px;display:flex;align-items:center;padding:0 var(--s5);
  border-radius:var(--r-f);font-size:var(--t-s);z-index:70;box-shadow:var(--e3);transition:transform .3s var(--ease)}
.snack.on{transform:translate(-50%,0)}

dialog#add{border:0;padding:0;border-radius:var(--r-xl);background:var(--surface-container-high);
  color:var(--on-surface);box-shadow:var(--e4);width:min(560px,92vw);max-width:none}
dialog#add::backdrop{background:color-mix(in srgb,#000 52%,transparent)}
dialog#add form{padding:var(--s6)}
dialog#add h2{font-family:var(--display);font-size:25px;font-weight:400;margin-bottom:var(--s2)}
.addsub{font-size:var(--t-s);color:var(--on-surface-variant);margin-bottom:var(--s4)}
#addurl{width:100%;padding:var(--s3) var(--s4);border:1px solid var(--outline);border-radius:var(--r-m);
  background:var(--surface-container-lowest);color:var(--on-surface);font:inherit;font-size:var(--t-b);resize:vertical}
#addurl:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}
.addnote{font-size:var(--t-s);color:var(--on-surface-variant);min-height:20px;margin-top:var(--s3)}
.addnote.bad{color:var(--error)}
.addnote.good{color:var(--primary)}
dialog#add menu{display:flex;gap:var(--s2);justify-content:flex-end;margin:var(--s5) 0 0;padding:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<header class="top">
  <button class="ico railbtn" id="railbtn" aria-label="Filters">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
  </button>
  <div class="brand"><b>Jev Atlas</b><i id="brandcount"></i></div>
  <div class="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search projects, authors, fields" aria-label="Search">
  </div>
  <div class="picks">
    <select class="pick" id="pickFam" aria-label="Family"></select>
    <select class="pick" id="pickCap" aria-label="Capability"></select>
  </div>
  <div class="acts">
    <button class="ico" id="theme" aria-label="Switch theme">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
    <button class="ico" id="cmd" aria-label="Jump to">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main class="feed" id="feed"></main>
  <aside class="pane" id="pane" aria-live="polite"></aside>
</div>
<div class="scrim" id="scrim" hidden></div>
<button class="fab" id="fab" aria-label="Add a project">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="cmdk" id="cmdk" hidden role="dialog" aria-modal="true" aria-label="Jump to">
  <div class="cmd"><input id="cmdq" placeholder="Jump to a project, field or capability" autocomplete="off"><div class="cmd-l" id="cmdl"></div></div>
</div>

<dialog id="add" aria-labelledby="addh">
  <form method="dialog" id="addform">
    <h2 id="addh">Add a project</h2>
    <p class="addsub">Paste a link from X, GitHub, Reddit, YouTube, npm or anywhere else. Several at once is fine.</p>
    <textarea id="addurl" rows="3" placeholder="https://github.com/someone/their-jev-thing" aria-label="Project links" required></textarea>
    <p id="addnote" class="addnote"></p>
    <menu>
      <button type="button" class="btn btn-o" id="addcancel">Cancel</button>
      <button type="submit" class="btn btn-f" id="addgo">Add</button>
    </menu>
  </form>
</dialog>
<div class="snack" id="snack" role="status" aria-live="polite"></div>

<script id="atlas-data" type="application/json">__DATA__</script>
<script id="atlas-thumbs" type="application/json">__THUMBS__</script>
<script id="atlas-thumbfiles" type="application/json">__THUMBFILES__</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById("atlas-data").textContent);
var TH=JSON.parse(document.getElementById("atlas-thumbs").textContent);
var TF=JSON.parse(document.getElementById("atlas-thumbfiles").textContent);
// One build inlines the picture, the other points at a file. Ask for either.
var thumb=function(id){return TH[id]||TF[id]||null};
var CAPS=D.capabilities,PATS=D.patterns,CATS=D.categories,FAMS=D.families;
var catBy={},famBy={},famOf={},famIdx={};
CATS.forEach(function(c){catBy[c.key]=c});
FAMS.forEach(function(f,i){famBy[f.key]=f;famIdx[f.key]=i+1;f.cats.forEach(function(c){famOf[c]=f.key})});
var el=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var famColor=function(k){return k?"var(--fam"+famIdx[k]+")":"var(--outline)"};
var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* Six family accents mixed from the three audited container roles, so no new
   hue needs validating. Colour here is a quiet wayfinding cue, never the only
   way a field is identified: every one carries its name and its count too. */
(function(){
  var roles=["--primary","--tertiary","--secondary","--primary","--tertiary","--secondary"];
  var pct=[70,70,70,40,40,40];
  var st=document.createElement("style");
  st.textContent=":root{"+roles.map(function(r,i){
    return "--fam"+(i+1)+":color-mix(in srgb, var("+r+") "+pct[i]+"%, var(--on-surface-variant));";
  }).join("")+"}";
  document.head.appendChild(st);
})();

var SRC={jevable:"X",github:"GitHub",awesome:"Curated",hackernews:"HN",devto:"dev.to",npm:"npm"};
var srcOf=function(e){return (e.discovered_via&&e.discovered_via[0])||"jevable"};
var S={cat:null,fam:null,cap:null,src:null,kind:null,q:"",sort:"top",sel:null};
var byId={};D.evidence.forEach(function(e){byId[String(e.id)]=e});

function pass(e){
  if(S.cat&&e.category!==S.cat)return false;
  if(S.fam&&famOf[e.category]!==S.fam)return false;
  if(S.cap&&(e.capabilities||[]).indexOf(S.cap)<0)return false;
  if(S.src&&srcOf(e)!==S.src)return false;
  if(S.kind&&(e.kind||e.format)!==S.kind)return false;
  if(S.q){var h=(e.title+" "+(e.author||"")+" "+(e.handle||"")+" "+(e.blurb||"")+" "+((catBy[e.category]||{}).label||"")).toLowerCase();
    if(h.indexOf(S.q.toLowerCase())<0)return false}
  return true;
}
function score(e){
  var s=Math.log10((e.stars||0)+1)*19;      // standing, heavily compressed
  if(thumb(String(e.id)))s+=72;                 // it has a real screenshot
  if((e.discovered_via||[])[0]==="awesome")s+=8;  // a human put it on a list
  if((e.blurb||"").length>60)s+=6;           // it explains itself
  return s;
}
function rows(){
  var r=D.evidence.filter(pass);
  r.sort(function(a,b){
    if(S.sort==="new")return String(b.date||"").localeCompare(String(a.date||""));
    if(S.sort==="az")return a.title.localeCompare(b.title);
    // "Top" is a blend, not a raw star count. Sorting on stars alone put every
    // starred GitHub repo first, and none of those carry an image, so the whole
    // first screen came back as placeholder tiles. Standing matters and so does
    // having something to look at.
    return score(b)-score(a)||a.title.localeCompare(b.title);
  });
  return r;
}
var countIf=function(fn){var n=0;D.evidence.forEach(function(e){if(fn(e))n++});return n};

function renderRail(){
  var maxc=Math.max.apply(null,CATS.map(function(c){return c.evidence_count}));
  var any=S.cat||S.fam||S.cap||S.src||S.kind||S.q;
  var h='<div class="rgrp"><div class="rgrp-h"><span class="ov">Field</span>'+
    '<button class="reset" id="reset"'+(any?"":" hidden")+'>Reset</button></div>';
  FAMS.forEach(function(f){
    var kids=CATS.filter(function(c){return famOf[c.key]===f.key});
    var open=S.fam===f.key||kids.some(function(c){return c.key===S.cat});
    h+='<div class="fam" style="--fc:'+famColor(f.key)+'">'+
      '<button class="fam-h" data-fam="'+f.key+'" aria-pressed="'+(S.fam===f.key&&!S.cat)+'">'+
        '<span class="fam-dot"></span>'+esc(f.label)+'<span class="fam-n">'+f.evidence_count+'</span></button>'+
      (open?'<div class="fields">'+kids.map(function(c){
        return '<button class="fld" data-cat="'+c.key+'" aria-pressed="'+(S.cat===c.key)+'">'+
          '<span class="fld-n">'+esc(c.label)+'</span><span class="fld-c">'+c.evidence_count+'</span>'+
          '<span class="fld-bar"><i style="width:'+Math.max(4,c.evidence_count/maxc*100).toFixed(0)+'%"></i></span></button>';
      }).join("")+'</div>':'')+'</div>';
  });
  h+='</div><div class="rgrp"><div class="rgrp-h"><span class="ov">Source</span></div>';
  Object.keys(SRC).forEach(function(k){
    var n=countIf(function(e){return srcOf(e)===k});
    if(!n)return;
    h+='<button class="opt" data-src="'+k+'" aria-pressed="'+(S.src===k)+'">'+esc(SRC[k])+'<span class="opt-n">'+n+'</span></button>';
  });
  h+='</div>';
  var kinds={};D.evidence.forEach(function(e){var k=e.kind||e.format;if(k)kinds[k]=(kinds[k]||0)+1});
  h+='<div class="rgrp"><div class="rgrp-h"><span class="ov">Type</span></div>';
  Object.keys(kinds).sort(function(a,b){return kinds[b]-kinds[a]}).slice(0,6).forEach(function(k){
    h+='<button class="opt" data-kind="'+k+'" aria-pressed="'+(S.kind===k)+'">'+esc(k)+'<span class="opt-n">'+kinds[k]+'</span></button>';
  });
  el("rail").innerHTML=h+'</div>';
}

function cover(e){
  var t=thumb(String(e.id));
  var badge='<span class="srcbadge">'+esc(SRC[srcOf(e)]||srcOf(e))+'</span>';
  // github, npm and the curated lists all resolve to a GitHub social card
  var og=["github","awesome","npm"].indexOf(srcOf(e))>-1?' data-og="1"':'';
  if(t)return '<div class="cover"'+og+'><img src="'+t+'" alt="" loading="lazy" decoding="async">'+badge+'</div>';
  var letter=(e.title||"?").trim().charAt(0).toUpperCase();
  return '<div class="cover"><div class="gen"><span>'+esc(letter)+'</span></div>'+badge+'</div>';
}
function card(e,wide){
  var cat=catBy[e.category]||{label:""};
  return '<article class="card'+(wide?" wide":"")+'" data-id="'+esc(e.id)+'" tabindex="0" role="button" '+
    'aria-label="'+esc(e.title)+'" style="--fc:'+famColor(famOf[e.category])+'" data-sel="'+(S.sel===String(e.id)?1:0)+'">'+
    cover(e)+
    '<div class="cbody"><h3 class="ctitle">'+esc(e.title)+'</h3>'+
      '<p class="cdesc">'+esc(e.blurb||"")+'</p>'+
      '<div class="cfoot"><span class="catdot"></span><span class="who">'+esc(cat.label)+
        (e.author?" &middot; "+esc(e.author):"")+'</span>'+
        (e.stars?'<span class="metric">&#9733; '+e.stars+'</span>':'')+'</div></div></article>';
}
function renderFeed(keep){
  if(!keep)shown=PAGE;
  var r=rows();
  var title=S.cat?catBy[S.cat].label:S.fam?famBy[S.fam].label:S.cap?CAPS[S.cap].label:"Everything";
  var h='<div class="fhead"><div><h1>'+esc(title)+'</h1>'+
    '<div class="sub">'+r.length+' of '+D.evidence.length+' projects, gathered from six sources</div></div>'+
    '<div class="sorter">'+["top","new","az"].map(function(k){
      return '<button data-sort="'+k+'" aria-pressed="'+(S.sort===k)+'">'+{top:"Top",new:"Newest",az:"A–Z"}[k]+'</button>'}).join("")+
    '</div></div>';
  if(!r.length){
    el("feed").innerHTML=h+'<div class="empty"><h3>Nothing matches</h3>'+
      '<p>No project clears every filter at once. Clear one on the left, or search for something broader.</p>'+
      '<button class="btn btn-f" id="reset2">Reset filters</button></div>';
    return;
  }
  // Windowed. Rendering all 1,442 cards built ~1,400 DOM subtrees and ~1,300
  // decoded images on the first frame, which is a long task on a phone for
  // rows nobody has scrolled to yet.
  shown=Math.min(shown,r.length);
  var slice=r.slice(0,shown);
  h+='<div class="bento">'+slice.map(function(e,i){
    // Feature only a real screenshot. A 2:1 social card letterboxed into a
    // double-width 16:10 tile is mostly empty bands.
    return card(e, i%9===0 && srcOf(e)==="jevable" && !!thumb(String(e.id)));
  }).join("")+'</div>';
  if(shown<r.length){
    h+='<div style="display:flex;justify-content:center;padding:var(--s7) 0 0">'+
       '<button class="btn btn-o" id="more">Show more &middot; '+(r.length-shown)+' left</button></div>';
  }
  el("feed").innerHTML=h;
  armSentinel(r.length);
}
var PAGE=60, shown=PAGE, io_=null;
function armSentinel(total){
  if(io_){io_.disconnect();io_=null}
  var btn=el("more");
  if(!btn||!("IntersectionObserver" in window))return;
  io_=new IntersectionObserver(function(es){
    if(es.some(function(x){return x.isIntersecting})){shown+=PAGE;renderFeed()}
  },{root:el("feed"),rootMargin:"600px"});
  io_.observe(btn);
}

function blueprintFor(c){return D.blueprints.filter(function(b){return b.category===c})[0]}
function renderPane(){
  if(!S.sel){document.body.classList.remove("pane-open");el("pane").innerHTML="";return}
  var e=byId[S.sel];
  if(!e){S.sel=null;document.body.classList.remove("pane-open");el("pane").innerHTML="";return}
  document.body.classList.add("pane-open");
  var cat=catBy[e.category]||{label:""},fam=famBy[famOf[e.category]]||{label:""};
  var t=thumb(String(e.id)),bp=blueprintFor(e.category);
  var near=D.evidence.filter(function(x){return x.category===e.category&&String(x.id)!==String(e.id)}).slice(0,5);
  var h='<div class="pane-top"><span class="ov">'+esc(SRC[srcOf(e)]||srcOf(e))+'</span>'+
    '<button class="ico" id="copylink" aria-label="Copy link to this project">'+
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 1 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 1 0 7 7l1-1"/></svg></button>'+
    '<button class="ico" id="paneclose" aria-label="Close">'+
      '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>'+
    '<div class="pane-body" style="--fc:'+famColor(famOf[e.category])+'">'+
    (t?'<div class="pane-cover"'+ (['github','awesome','npm'].indexOf(srcOf(e))>-1?' data-og="1"':'') +'><img src="'+t+'" alt=""></div>':'')+
    '<h2>'+esc(e.title)+'</h2>'+
    '<p class="lede">'+esc(e.blurb||"No description was published with this project.")+'</p>'+
    '<div class="cta"><a class="btn btn-f" href="'+esc(e.url)+'" target="_blank" rel="noopener">Open the project'+
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a>'+
      (bp?'<button class="btn btn-o" data-bpshow="'+bp.id+'">How one gets built</button>':'')+'</div>'+
    '<dl class="kv"><dt>Field</dt><dd>'+esc(cat.label)+'</dd>'+
      '<dt>Family</dt><dd>'+esc(fam.label)+'</dd>'+
      (e.author?'<dt>By</dt><dd>'+esc(e.author)+'</dd>':'')+
      '<dt>Source</dt><dd>'+esc(SRC[srcOf(e)]||srcOf(e))+'</dd>'+
      (e.stars?'<dt>Stars</dt><dd class="mono">'+e.stars+'</dd>':'')+
      (e.date?'<dt>Seen</dt><dd class="mono">'+esc(e.date)+'</dd>':'')+
      '<dt>Shape</dt><dd>'+esc((PATS[e.pattern]||{}).label||e.pattern||"")+'</dd></dl>';
  if(bp){
    h+='<div class="sec"><span class="ov">Build order</span><ol class="steps">'+bp.phases.map(function(p){
      return '<li class="step"><span class="sdot">'+p.n+'</span><div><div class="sname">'+esc(p.name)+'</div>'+
        '<div class="sdet">'+esc(p.detail)+'</div></div></li>'}).join("")+'</ol></div>'+
      '<div class="sec"><span class="ov">What goes wrong</span>'+
        bp.hard_parts.map(function(x){return '<p class="risk">'+esc(x)+'</p>'}).join("")+'</div>';
  }
  if(near.length){
    h+='<div class="sec"><span class="ov">More in '+esc(cat.label)+'</span><div class="related">'+
      near.map(function(x){return '<button class="rel" data-id="'+esc(x.id)+'">'+
        '<span class="catdot" style="--fc:'+famColor(famOf[x.category])+'"></span>'+
        '<span class="rel-t">'+esc(x.title)+'</span></button>'}).join("")+'</div></div>';
  }
  el("pane").innerHTML=h+'</div>';
  el("pane").scrollTop=0;
}

function renderPicks(){
  var f=el("pickFam");
  f.innerHTML='<option value="">All families</option>'+FAMS.map(function(x){
    return '<option value="'+x.key+'"'+(S.fam===x.key?" selected":"")+'>'+esc(x.label)+' ('+x.evidence_count+')</option>'}).join("");
  f.classList.toggle("on",!!S.fam);
  var counts={};D.evidence.forEach(function(e){(e.capabilities||[]).forEach(function(c){counts[c]=(counts[c]||0)+1})});
  var c=el("pickCap");
  c.innerHTML='<option value="">All capabilities</option>'+Object.keys(CAPS).filter(function(k){return counts[k]})
    .sort(function(a,b){return counts[b]-counts[a]}).map(function(k){
      return '<option value="'+k+'"'+(S.cap===k?" selected":"")+'>'+esc(CAPS[k].label)+' ('+counts[k]+')</option>'}).join("");
  c.classList.toggle("on",!!S.cap);
  el("brandcount").textContent=D.evidence.length+" projects";
}
function render(){renderPicks();renderRail();renderFeed();renderPane();writeHash()}

function writeHash(){
  var p=[];
  if(S.sel)p.push("p="+encodeURIComponent(S.sel));
  if(S.cat)p.push("field="+S.cat); else if(S.fam)p.push("family="+S.fam);
  if(S.cap)p.push("cap="+S.cap);
  if(S.src)p.push("src="+S.src);
  if(S.kind)p.push("kind="+encodeURIComponent(S.kind));
  if(S.q)p.push("q="+encodeURIComponent(S.q));
  if(S.sort!=="top")p.push("sort="+S.sort);
  var h=p.length?"#"+p.join("&"):"#";
  if(location.hash!==h)history.replaceState(null,"",h);
}
function readHash(){
  var s=(location.hash||"").replace(/^#/,"");
  if(!s)return;
  s.split("&").forEach(function(kv){
    var i=kv.indexOf("=");if(i<0)return;
    var k=kv.slice(0,i),v=decodeURIComponent(kv.slice(i+1));
    if(k==="p"&&byId[v])S.sel=v;
    else if(k==="field"&&catBy[v]){S.cat=v;S.fam=famOf[v]}
    else if(k==="family"&&famBy[v])S.fam=v;
    else if(k==="cap"&&CAPS[v])S.cap=v;
    else if(k==="src")S.src=v;
    else if(k==="kind")S.kind=v;
    else if(k==="q"){S.q=v;el("q").value=v}
    else if(k==="sort")S.sort=v;
  });
}


/* ── Add a project ──────────────────────────────────────────────────────────
   The page cannot fetch a URL: the artifact CSP blocks every cross-origin
   request and no capability grants HTTP. So this does the part a browser can
   honestly do — recognise the link, catch duplicates against the 1,442 already
   here, and hand back something the pipeline can ingest. It never claims to
   have fetched anything. */
var SRCPAT=[
  [/^https?:\/\/(?:www\.)?(?:x|twitter)\.com\/([^/]+)\/status\/(\d+)/i,function(m){return"X post by @"+m[1]}],
  [/^https?:\/\/(?:www\.)?github\.com\/([^/]+)\/([^/?#]+)/i,function(m){return"GitHub repo "+m[1]+"/"+m[2]}],
  [/^https?:\/\/(?:www\.|old\.)?reddit\.com\/r\/([^/]+)\//i,function(m){return"Reddit post in r/"+m[1]}],
  [/^https?:\/\/(?:www\.)?(?:youtube\.com\/watch|youtu\.be\/)/i,function(){return"YouTube video"}],
  [/^https?:\/\/(?:www\.)?npmjs\.com\/package\/(.+)/i,function(m){return"npm package "+m[1]}]
];
function describe(u){
  for(var i=0;i<SRCPAT.length;i++){var m=u.match(SRCPAT[i][0]);if(m)return SRCPAT[i][1](m)}
  try{return "Website "+new URL(u).hostname.replace(/^www\./,"")}catch(e){return null}
}
var canon=function(u){try{var v=new URL(u);return(v.hostname.replace(/^www\./,"")+v.pathname.replace(/\/+$/,"")).toLowerCase()}catch(e){return String(u).toLowerCase()}};
var HAVE={};D.evidence.forEach(function(e){HAVE[canon(e.url)]=e.title});
function checkAdd(){
  var raw=el("addurl").value;
  var urls=raw.split(/[\s,]+/).map(function(x){return x.trim()}).filter(function(x){return /^(https?:\/\/|[a-z0-9-]+\.[a-z]{2,}\/)/i.test(x)});
  var note=el("addnote");
  if(!urls.length){note.className="addnote";note.textContent="";return[]}
  var fresh=[],dupe=[];
  urls.forEach(function(u){
    if(!/^https?:\/\//i.test(u))u="https://"+u;
    (HAVE[canon(u)]?dupe:fresh).push(u);
  });
  if(!fresh.length){note.className="addnote bad";
    note.textContent=dupe.length===1?"Already here: "+HAVE[canon(dupe[0])]:"All "+dupe.length+" are already in the atlas.";
    return[]}
  var d=describe(fresh[0]);
  note.className="addnote good";
  note.textContent=fresh.length===1?("Recognised: "+d+(dupe.length?"  ("+dupe.length+" duplicate skipped)":""))
    :(fresh.length+" links ready"+(dupe.length?", "+dupe.length+" already here":""));
  return fresh;
}

var items=[],sel=0;
function buildCmd(){
  items=FAMS.map(function(f){return{t:f.label,k:"family",go:function(){S.fam=f.key;S.cat=null;render()}}})
   .concat(CATS.map(function(c){return{t:c.label,k:"field · "+c.evidence_count,go:function(){S.cat=c.key;S.fam=famOf[c.key];render()}}}))
   .concat(Object.keys(CAPS).map(function(k){return{t:CAPS[k].label,k:"capability",go:function(){S.cap=k;render()}}}))
   .concat(D.evidence.map(function(e){return{t:e.title,k:(SRC[srcOf(e)]||"")+(e.author?" · "+e.author:""),go:function(){openCard(String(e.id))}}}));
}
function cmdRender(){
  var q=el("cmdq").value.trim().toLowerCase();
  var l=items.filter(function(i){return !q||i.t.toLowerCase().indexOf(q)>-1||i.k.toLowerCase().indexOf(q)>-1}).slice(0,50);
  sel=Math.max(0,Math.min(sel,l.length-1));
  el("cmdl").innerHTML=l.length?l.map(function(i,n){
    return '<button class="cmd-i" data-i="'+n+'" data-s="'+(n===sel?1:0)+'">'+esc(i.t)+'<span class="cmd-k">'+esc(i.k)+'</span></button>'}).join("")
    :'<div style="padding:24px;text-align:center;color:var(--on-surface-variant)">Nothing called that</div>';
  el("cmdl")._l=l;
  var a=el("cmdl").querySelector('[data-s="1"]');if(a&&a.scrollIntoView)a.scrollIntoView({block:"nearest"});
}
function cmdOpen(){el("cmdk").hidden=false;el("cmdq").value="";sel=0;cmdRender();el("cmdq").focus()}
function cmdClose(){el("cmdk").hidden=true}
var tt;
function snack(m){var s=el("snack");s.textContent=m;s.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){s.classList.remove("on")},2000)}
function openCard(id){S.sel=String(id);render();
  var c=el("feed").querySelector('[data-id="'+id+'"]');
  if(c&&c.scrollIntoView)c.scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"})}

document.addEventListener("click",function(ev){
  if(ev.target.closest("a"))return;
  var t=ev.target.closest("button,[data-id]");
  if(!t)return;
  var d=t.dataset;
  if(t.id==="railbtn"){var o=el("rail").classList.toggle("open");el("scrim").hidden=!o;return}
  if(t.id==="theme"){var dk=document.documentElement.getAttribute("data-theme")==="dark";
    document.documentElement.setAttribute("data-theme",dk?"light":"dark");
    try{localStorage.setItem("theme",dk?"light":"dark")}catch(e){}return}
  if(t.id==="cmd"){cmdOpen();return}
  if(t.id==="fab"){var dlg=el("add");el("addurl").value="";el("addnote").textContent="";
    if(dlg.showModal)dlg.showModal();else snack("This browser cannot open the dialog");return}
  if(t.id==="addcancel"){el("add").close();return}
  if(t.id==="paneclose"){S.sel=null;render();return}
  if(t.id==="copylink"){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(location.href).then(function(){snack("Link copied")},function(){snack("Could not copy")});
    } else snack("Copy is not available here");
    return}
  if(t.id==="more"){shown+=PAGE;renderFeed(true);return}
  if(t.id==="reset"||t.id==="reset2"){S.cat=S.fam=S.cap=S.src=S.kind=null;S.q="";el("q").value="";render();return}
  if(d.bpshow){snack("Build guides live in the blueprint view");return}
  if(d.fam){S.fam=(S.fam===d.fam&&!S.cat)?null:d.fam;S.cat=null;render();return}
  if(d.cat){S.cat=S.cat===d.cat?null:d.cat;if(S.cat)S.fam=famOf[S.cat];render();return}
  if(d.src){S.src=S.src===d.src?null:d.src;render();return}
  if(d.kind){S.kind=S.kind===d.kind?null:d.kind;render();return}
  if(d.sort){S.sort=d.sort;render();return}
  if(d.i!==undefined){var it=(el("cmdl")._l||[])[+d.i];cmdClose();if(it)it.go();return}
  if(d.id){openCard(d.id);return}
});
document.addEventListener("keydown",function(e){
  var pal=!el("cmdk").hidden;
  if((e.key==="k"||e.key==="K")&&(e.metaKey||e.ctrlKey)){e.preventDefault();pal?cmdClose():cmdOpen();return}
  if(e.key==="/"&&!pal&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){e.preventDefault();cmdOpen();return}
  if(pal){
    if(e.key==="Escape"){cmdClose();return}
    if(e.key==="ArrowDown"){e.preventDefault();sel++;cmdRender();return}
    if(e.key==="ArrowUp"){e.preventDefault();sel--;cmdRender();return}
    if(e.key==="Enter"){e.preventDefault();var it=(el("cmdl")._l||[])[sel];cmdClose();if(it)it.go();return}
    return;
  }
  if(e.key==="Escape"&&S.sel){S.sel=null;render();return}
  var af=document.activeElement;
  if((e.key==="Enter"||e.key===" ")&&af&&af.dataset&&af.dataset.id){e.preventDefault();openCard(af.dataset.id)}
});
el("scrim").addEventListener("click",function(){el("rail").classList.remove("open");el("scrim").hidden=true});
el("q").addEventListener("input",function(e){S.q=e.target.value;renderFeed();renderRail();writeHash()});
el("pickFam").addEventListener("change",function(e){S.fam=e.target.value||null;S.cat=null;render()});
el("pickCap").addEventListener("change",function(e){S.cap=e.target.value||null;render()});
el("cmdq").addEventListener("input",function(){sel=0;cmdRender()});
el("cmdk").addEventListener("click",function(e){if(e.target===el("cmdk"))cmdClose()});

el("addurl").addEventListener("input",checkAdd);
el("addform").addEventListener("submit",function(ev){
  var fresh=checkAdd();
  if(!fresh.length){ev.preventDefault();return}
  // No backend yet. Rather than pretend, hand the list back so it can be
  // pasted into `npm run harvest -- --merge`, which does the real fetching.
  var payload=fresh.join(String.fromCharCode(10));
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(payload).then(function(){
      snack(fresh.length+" link"+(fresh.length>1?"s":"")+" copied for the harvester")},
      function(){snack("Could not copy")});
  } else snack(fresh.length+" link(s) ready");
  el("add").close();
});
try{var th=localStorage.getItem("theme");if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}
readHash();buildCmd();render();
})();
</script>
